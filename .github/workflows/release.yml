name: Release Pipeline

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-release:
    name: Build Cross-Platform Binaries
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'

      - name: Run Tests
        run: go test -v -count=1 ./assets/... ./cmd/... ./internal/...

      - name: Build Windows Executable
        run: |
          go build -ldflags="-s -w -X main.version=${{ github.ref_name }}" -o gocontact-windows-amd64.exe ./cmd/addressbook

      - name: Generate Checksums
        run: |
          Get-FileHash -Algorithm SHA256 gocontact-windows-amd64.exe | Out-File -Encoding utf8 SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            gocontact-windows-amd64.exe
            SHA256SUMS.txt
          generate_release_notes: true
          draft: false
          prerelease: false
