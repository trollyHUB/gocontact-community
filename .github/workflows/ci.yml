name: GoContact Community CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-linux:
    name: Linux Core Tests & Clean Architecture
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'

      - name: Verify Clean Architecture (internal/domain 0 external imports)
        run: |
          IMPORTS=$(go list -f '{{join .Imports "\n"}}' ./internal/domain/...)
          FORBIDDEN=$(echo "$IMPORTS" | grep -E "database/sql|fyne.io|net/http" || true)
          if [ -n "$FORBIDDEN" ]; then
            echo "Clean Architecture violation in internal/domain! Forbidden imports:"
            echo "$FORBIDDEN"
            exit 1
          fi
          echo "Clean Architecture check passed: internal/domain is pure."

      - name: Run Core Package Tests with Race Detector
        run: |
          go test -v -race ./assets/... ./internal/config/... ./internal/domain/... ./internal/infrastructure/... ./internal/repository/... ./internal/service/...

  test-and-build-windows:
    name: Windows Full Suite & PE Build
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'

      - name: Run Full Unit, Integration & Headless Fyne UI Tests
        run: go test -v -count=1 ./assets/... ./cmd/... ./internal/...

      - name: Build Windows Executable (-ldflags="-s -w")
        run: go build -ldflags="-s -w" -o addressbook.exe ./cmd/addressbook
